<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Watch Live TV and News">
  <meta name="referrer" content="no-referrer">

  <!-- 🛡️ SMART CACHING & SELF-HEALING SYSTEM -->
  <script>
    // 1. One-time Cache & SW Purge on version update (to clean up old corrupted state)
    const CACHE_CLEAN_VERSION = 'v3.1';
    if (localStorage.getItem('cache_clean_version') !== CACHE_CLEAN_VERSION) {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function (boolean) {
              console.log('[PWA] Old Service Worker Purged: ', boolean);
            });
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (let name of names) {
            caches.delete(name);
          }
          console.log('[PWA] One-time Cache Storage Cleared');
        });
      }
      localStorage.setItem('cache_clean_version', CACHE_CLEAN_VERSION);
    } else {
      // Clean up old custom service worker ONLY, keep Flutter's official one
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) {
            if (registration.active && 
                registration.active.scriptURL.includes('service-worker.js') && 
                !registration.active.scriptURL.includes('flutter_service_worker.js')) {
              registration.unregister().then(function (boolean) {
                console.log('[PWA] Unregistered deprecated custom service worker:', boolean);
              });
            }
          }
        });
      }
    }

    // 2. Global Error Handler & Self-Healing Logic for Cache Mismatch / MIME Corruption
    window.onerror = function(message, source, lineno, colno, error) {
      console.error('[Global Error Intercepted]', {message, source, lineno, colno, error});
      
      const errorStr = String(message).toLowerCase();
      // Detect critical loading failures (Unexpected token '<', MIME type errors, import failures)
      if (
        errorStr.includes('unexpected token') || 
        errorStr.includes('mime') || 
        errorStr.includes('failed to fetch') ||
        errorStr.includes('typeerror')
      ) {
        console.warn('[PWA] Potential cache corruption detected. Performing self-healing factory reset...');
        
        // Reset everything
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (names) {
            for (let name of names) {
              caches.delete(name);
            }
          });
        }
        localStorage.removeItem('cache_clean_version'); // Reset cleanup flag
        
        // Force reload from server bypassing cache
        setTimeout(() => {
          window.location.reload(true);
        }, 800);
      }
    };
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hesen TV">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="manifest" href="manifest.json">

  <style>
    body,
    html {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif !important;
      /* Native App Feel Tricks */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior-y: none;
    }
  </style>



  <!-- Removed legacy flutter.js -->


  <!-- Vidstack Player (v1.12.12 - Pinned stable version) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.12.12/player/theme.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.12.12/player/video.css" media="print" onload="this.media='all'" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.12.12/player.js" defer></script>
  <!-- XHR Interceptor: Routes HLS segment requests through HTTPS proxy -->
  <script src="xhr_interceptor.js?v=2.1" defer></script>
  <!-- Security Measures -->
  <!-- <script src="anti_debug.js"></script> -->
  <!-- PWA Install Prompt (DISABLED) -->
  <!-- <script src="install_prompt.js"></script> -->

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      overflow: hidden;
    }

    /* Custom Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #000 0%, #1a1a2e 100%);
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-container {
      width: 120px;
      height: 120px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(124, 82, 216, 0.6);
      animation: pulse 2s ease-in-out infinite;
    }

    .logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    .loader {
      margin-top: 30px;
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #7C52D8;
      border-left-color: #7C52D8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-progress {
      margin-top: 8px;
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .loader-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7C52D8, #B388FF);
      border-radius: 4px;
      animation: progressAnim 30s ease-in-out forwards;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes progressAnim {
      0%   { width: 0%; }
      30%  { width: 40%; }
      60%  { width: 65%; }
      85%  { width: 85%; }
      100% { width: 95%; }
    }
    .splash-status {
      margin-top: 16px;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      direction: rtl;
      transition: opacity 0.3s;
    }
    .splash-timer {
      margin-top: 4px;
      color: rgba(255,255,255,0.35);
      font-size: 12px;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    @keyframes dotPulse {
      0%, 20% { opacity: 0; }
      50% { opacity: 1; }
      80%, 100% { opacity: 0; }
    }
    .dot-1 { animation: dotPulse 1.5s infinite 0s; }
    .dot-2 { animation: dotPulse 1.5s infinite 0.3s; }
    .dot-3 { animation: dotPulse 1.5s infinite 0.6s; }

    /* Hide Flutter Default Loading */
    .loading {
      display: none !important;
    }
  </style>
</head>

<body>
  <!-- Custom Splash Screen (ENABLED) -->
  <div id="splash">
    <div class="logo-container">
      <img src="apple-touch-icon-v3.png" alt="7esenTV Logo">
    </div>
    <div class="loader"></div>
    <div class="loader-progress">
      <div class="loader-progress-bar"></div>
    </div>
    <div class="splash-status" id="splashStatus">جاري تحميل المحرك<span class="dot-1">.</span><span class="dot-2">.</span><span class="dot-3">.</span></div>
    <div class="splash-timer" id="splashTimer">0 ثانية</div>
  </div>

  <!-- Flutter App Container -->
  <div id="flutter-app"></div>

  <script>
    // ✅ Splash Timer + Status
    (function() {
      const statusEl = document.getElementById('splashStatus');
      const timerEl = document.getElementById('splashTimer');
      const startTime = Date.now();
      const messages = [
        { after: 0, text: 'جاري تحميل المحرك' },
        { after: 10, text: 'جاري تجهيز التطبيق' },
        { after: 30, text: 'قد يستغرق التحميل دقيقة' },
        { after: 50, text: 'مرة واحدة فقط عند التحديث' },
      ];
      let lastMsgIdx = -1;

      setInterval(function() {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        timerEl.textContent = elapsed + ' ثانية';

        for (let i = messages.length - 1; i >= 0; i--) {
          if (elapsed >= messages[i].after && lastMsgIdx !== i) {
            statusEl.innerHTML = messages[i].text + '<span class="dot-1">.</span><span class="dot-2">.</span><span class="dot-3">.</span>';
            lastMsgIdx = i;
            break;
          }
        }
      }, 1000);
    })();

    // ✅ Remove Splash when Flutter is ready (Called from Dart)
    window.removeSplashFromWeb = function () {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
      }
    };

    // 🚨 FAILSAFE: Force remove splash after 60 seconds if Flutter fails to load
    setTimeout(() => {
      const splash = document.getElementById('splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
      }
    }, 60000);

    // ✅ Service Worker Registration (DISABLED for iOS stability)
    /*
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.error('[SW] Failed:', err));
      });
    }
    */

    // 🔴 FORCE UNREGISTER ALL SERVICE WORKERS (To fix 'TypeError: Response' crash)
    // Script moved to head for earlier execution.

    // ✅ PWA Install Prompt
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('[PWA] Install prompt available');
    });

    window.triggerInstallPrompt = function () {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        window.deferredPrompt.userChoice.then((choice) => {
          console.log('[PWA] User choice:', choice.outcome);
          window.deferredPrompt = null;
        });
      } else {
        console.log('[PWA] No install prompt available');
      }
    };

    // ✅ Check if running as PWA
    window.isPwaStandalone = function () {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    };
  </script>

  <!-- ✅ Firebase Compat (Required for Flutter Firebase Plugins) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-storage-compat.js" defer></script>

  <!-- ✅ Firebase Initialization Helper (deferred) -->
  <script src="firebase-init.js" defer></script>

  <!-- ✅ Flutter Initialization (SW disabled for fast PWA startup) -->
  <script>
    // Prevent Flutter's service worker from registering (saves ~4s on PWA startup)
    // PWA not needed for offline since content requires internet (streaming video)
    const origRegister = navigator.serviceWorker?.register;
    if (origRegister) {
      navigator.serviceWorker.register = function() {
        return Promise.resolve({ active: { state: 'activated', scriptURL: '' } });
      };
    }
    // Also patch getRegistration to return null instantly
    const origGetReg = navigator.serviceWorker?.getRegistration;
    if (origGetReg) {
      navigator.serviceWorker.getRegistration = function() {
        return Promise.resolve(null);
      };
    }
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>

</html>
